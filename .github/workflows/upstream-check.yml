name: Upstream Omarchy Bar Check

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check-upstream:
    name: Compare against omacom/omarchy bar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      files: ${{ steps.compare.outputs.files }}
      sha: ${{ steps.compare.outputs.sha }}
      short_sha: ${{ steps.compare.outputs.short_sha }}
      msg: ${{ steps.compare.outputs.msg }}
      last_sync: ${{ steps.compare.outputs.last_sync }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch upstream bar files and compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          changed=()
          for f in Bar.qml BarModel.js; do
            curl -fsSL \
              "https://raw.githubusercontent.com/omacom/omarchy/quattro/shell/plugins/bar/$f" \
              -o "$tmp/$f"
            if ! cmp -s "upstream/$f.orig" "$tmp/$f"; then
              changed+=("$f")
            fi
          done

          if (( ${#changed[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Barcraft upstream base matches omacom/omarchy (quattro)."
            exit 0
          fi

          upstream_sha="$(gh api 'repos/omacom/omarchy/commits?sha=quattro&path=shell/plugins/bar&per_page=1' --jq '.[0].sha // "unknown"')"
          upstream_msg="$(gh api 'repos/omacom/omarchy/commits?sha=quattro&path=shell/plugins/bar&per_page=1' --jq '.[0].commit.message | split("\n")[0] // ""')"
          last_sync="$(cat upstream/VERSION 2>/dev/null || echo unknown)"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "files=${changed[*]}" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${upstream_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "msg=$upstream_msg" >> "$GITHUB_OUTPUT"
          echo "last_sync=$last_sync" >> "$GITHUB_OUTPUT"

          echo "Upstream changed: ${changed[*]} (commit ${upstream_sha:0:7}: $upstream_msg)"

  report-issue:
    name: Open or update tracking issue
    runs-on: ubuntu-latest
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    permissions:
      issues: write

    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGED_FILES: ${{ needs.check-upstream.outputs.files }}
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.sha }}
          UPSTREAM_SHORT: ${{ needs.check-upstream.outputs.short_sha }}
          UPSTREAM_MSG: ${{ needs.check-upstream.outputs.msg }}
          LAST_SYNC: ${{ needs.check-upstream.outputs.last_sync }}
        run: |
          set -euo pipefail

          # Ensure the 'upstream' label exists.
          gh label create upstream \
            --description "Upstream Omarchy bar changes to merge" \
            --color "5319e7" \
            --force >/dev/null

          existing="$(gh issue list --state open --label upstream --json number,body --jq '.[0] // empty')"

          body="$(cat <<EOF
          Upstream \`omacom/omarchy\` (\`quattro\`) modified the stock bar plugin since Barcraft's last sync (\`${LAST_SYNC}\`).

          - **Changed files:** \`${CHANGED_FILES}\`
          - **Latest upstream commit:** [\`${UPSTREAM_SHORT}\`](https://github.com/omacom/omarchy/commit/${UPSTREAM_SHA}) — ${UPSTREAM_MSG}

          ### How to sync
          \`\`\`bash
          scripts/sync-upstream.sh
          omarchy agent look plugin .
          \`\`\`
          If three-way merge reports conflicts, resolve them and run \`scripts/sync-upstream.sh --mark-synced\`.
          EOF
          )"

          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "Upstream Omarchy bar updated (${UPSTREAM_SHORT})" \
              --label upstream \
              --body "$body"
          else
            issue_num="$(jq -r '.number' <<<"$existing")"
            if ! gh issue view "$issue_num" --json body,comments \
              --jq '[.body, (.comments[].body)] | join("\n")' | grep -Fq "$UPSTREAM_SHA"; then
              gh issue comment "$issue_num" --body "$body"
            else
              echo "Issue #$issue_num already mentions commit $UPSTREAM_SHORT; skipping comment."
            fi
          fi
